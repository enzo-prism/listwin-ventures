<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Don Listwin CV</title>
    <meta name="description" content="Private curriculum vitae for Don Listwin." />
    <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <meta name="bingbot" content="noindex,nofollow,noarchive,nosnippet,noimageindex" />
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-width: 0;
        background: #f4f3ef;
        color: #17202a;
      }

      main {
        width: min(100%, 76rem);
        min-height: 100vh;
        margin: 0 auto;
        padding: clamp(1rem, 3vw, 2rem);
      }

      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 1rem;
        margin-bottom: 1rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.65rem, 4vw, 2.35rem);
        line-height: 1.1;
      }

      .intro {
        margin: 0.35rem 0 0;
        color: #5b6470;
        line-height: 1.5;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 0.55rem;
      }

      .button {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        border: 1px solid #17202a;
        border-radius: 999px;
        padding: 0.65rem 1rem;
        background: #fff;
        color: #17202a;
        font: inherit;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        cursor: pointer;
      }

      .button.primary {
        background: #17202a;
        color: #fff;
      }

      .button:hover {
        background: #e8e7e2;
      }

      .button.primary:hover {
        background: #303b46;
      }

      .button:focus-visible {
        outline: 3px solid #1e6091;
        outline-offset: 2px;
      }

      form {
        margin: 0;
      }

      .viewer {
        width: 100%;
        display: grid;
        gap: 1.25rem;
      }

      .page {
        display: block;
        width: min(100%, 53rem);
        height: auto;
        margin: 0 auto;
        border: 1px solid #d8d6cf;
        background: #fff;
        box-shadow: 0 0.75rem 2.5rem rgba(23, 32, 42, 0.08);
      }

      .fallback {
        margin: 0.75rem 0 0;
        color: #5b6470;
        font-size: 0.9rem;
      }

      .fallback a {
        color: #174f78;
      }

      @media (max-width: 760px) {
        .header {
          display: block;
        }

        .actions {
          justify-content: flex-start;
          margin-top: 1rem;
        }

        .viewer {
          gap: 0.75rem;
        }
      }

      @media print {
        @page {
          size: letter;
          margin: 0;
        }

        body,
        main {
          background: #fff;
        }

        main {
          width: auto;
          margin: 0;
          padding: 0;
        }

        .header,
        .fallback {
          display: none;
        }

        .viewer {
          display: block;
        }

        .page {
          width: 8.5in;
          height: 11in;
          border: 0;
          box-shadow: none;
          break-after: page;
          page-break-after: always;
        }

        .page:last-child {
          break-after: auto;
          page-break-after: auto;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header class="header">
        <div>
          <h1>Don Listwin CV</h1>
          <p class="intro">July 2026 original-format CV</p>
        </div>
        <nav class="actions" aria-label="CV actions">
          <a class="button primary" href="/cv/download.doc">Download Word CV</a>
          <a class="button" href="/cv/document.pdf" target="_blank" rel="noreferrer">Open printable PDF</a>
          <form method="post" action="/cv/logout">
            <button type="submit" class="button">Sign out</button>
          </form>
        </nav>
      </header>

      <section class="viewer" aria-label="Don Listwin CV preview">
        <img
          class="page"
          src="/cv/page-1.png"
          alt="Page 1 of Don Listwin's July 2026 CV"
          width="1224"
          height="1584"
        />
        <img
          class="page"
          src="/cv/page-2.png"
          alt="Page 2 of Don Listwin's July 2026 CV"
          width="1224"
          height="1584"
          loading="lazy"
          decoding="async"
        />
      </section>
      <p class="fallback">
        If the preview does not load, <a href="/cv/document.pdf">open the printable PDF</a>.
      </p>
    </main>
  </body>
</html>
